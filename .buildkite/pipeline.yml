steps:
  # Step 1: Generate sentence and create annotation
  - label: "Generate Lorem Ipsum Sentence"
    key: "sentence-step"
    command:
      - "pip install loremipsum"
      - "python -c \"import loremipsum; result = loremipsum.sentence(max_char=20); print(result); open('result.txt', 'w').write(result)\""
      - "buildkite-agent annotate \"**Sentence Result:**<br>$(cat result.txt)\" --style info --context sentence"
    plugins:
      - docker#v5.11.0:
          image: "python:3.13"
          workdir: /workdir
    branches: "demo"